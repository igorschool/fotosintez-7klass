<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Лист-детектив · 7 класс</title>
  <meta name="description" content="Игра: какие условия нужны для фотосинтеза. Свет, углекислый газ, хлорофилл." />
  <style>
    :root {
      --navy: #0B3D4A; --teal: #1A6B7A; --gold: #C4A035; --cream: #F6F1E6;
      --sky: #E8F3F6; --dark: #14323A; --rose: #B42318; --green: #1F7A3A;
      --line: #C5D5D8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
      background: radial-gradient(1200px 700px at 10% -10%, #1a6b7a 0%, var(--navy) 45%, #071f26 100%);
      color: var(--dark);
    }
    #app { max-width: 920px; margin: 0 auto; padding: 16px 14px 40px; }
    .screen { display: none; animation: rise .35s ease; }
    .screen.on { display: block; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .top { display: flex; justify-content: space-between; align-items: center; color: #d7e3dc; font-size: 13px; margin-bottom: 12px; gap: 8px; }
    .badge { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); padding: 6px 10px; border-radius: 999px; color: #fff; }
    .badge b { color: var(--gold); }
    .card { background: var(--cream); border-radius: 22px; padding: 22px 20px 20px; box-shadow: 0 16px 40px rgba(0,0,0,.28); }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 38px); color: var(--navy); line-height: 1.15; }
    h2 { margin: 0 0 10px; font-size: 22px; color: var(--navy); }
    p { margin: 0 0 12px; line-height: 1.5; }
    .kicker { color: #8a6d16; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; margin-bottom: 8px; }
    .lead { font-size: 16px; color: #355056; }
    button {
      appearance: none; border: 0; cursor: pointer; font-family: inherit;
      background: var(--navy); color: #fff; font-weight: 800;
      padding: 13px 16px; border-radius: 14px; font-size: 16px; margin: 4px 4px 0 0;
    }
    button:active { transform: scale(.98); }
    button.gold { background: var(--gold); color: #2b2208; }
    button.ghost { background: #fff; color: var(--navy); border: 2px solid var(--line); }
    button.green { background: var(--green); }
    button.rose { background: var(--rose); }
    button:disabled { opacity: .45; cursor: default; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
    .lab-card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; width: 100%; color: var(--navy); }
    .lab-card small { display: block; color: #5b6d71; font-weight: 700; margin-bottom: 4px; }
    .hint, .ok, .bad { border-radius: 10px; padding: 10px 12px; margin: 12px 0; font-weight: 700; }
    .hint { background: var(--sky); border-left: 5px solid var(--teal); }
    .ok { background: #e7f6ea; border-left: 5px solid var(--green); }
    .bad { background: #fdecea; border-left: 5px solid var(--rose); }
    .arena { background: #fff; border: 2px dashed var(--line); border-radius: 18px; padding: 14px; margin: 12px 0; }
    .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .tog {
      background: #fff; border: 3px solid var(--line); border-radius: 14px;
      padding: 10px 12px; font-weight: 800; color: var(--navy); min-width: 120px;
    }
    .tog.on { border-color: var(--green); background: #e7f6ea; }
    .tog.off { border-color: var(--rose); background: #fdecea; }
    .tube {
      width: min(100%, 220px); height: 220px; margin: 0 auto; border: 6px solid #9aa8ad;
      border-radius: 16px 16px 40px 40px; background: #cfe9ef; position: relative; overflow: hidden;
    }
    .tube.dark { background: #2a3540; }
    .plant { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 70px; height: 110px; }
    .leafs { position: absolute; bottom: 40px; left: 18px; right: 18px; height: 80px; }
    .bubble {
      position: absolute; width: 10px; height: 10px; border: 2px solid #1A6B7A; border-radius: 50%;
      animation: up 1.4s linear infinite;
    }
    @keyframes up { from { bottom: 50px; opacity: 1; } to { bottom: 200px; opacity: 0; } }
    .lamp { text-align: center; font-size: 42px; margin: 4px; filter: grayscale(1); }
    .lamp.on { filter: none; }
    .leaves { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .leafbox {
      background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 10px; text-align: center;
    }
    .leafbox.pick { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(196,160,53,.25); }
    .blob {
      width: 88px; height: 54px; margin: 8px auto; border-radius: 50% 50% 45% 55%;
      background: #3e944e; border: 3px solid #1f5e30;
    }
    .blob.white { background: #f3f0e4; border-color: #c5c0a8; }
    .blob.foil { background: linear-gradient(135deg, #3e944e 40%, #c5c8cc 41%); }
    .blob.dark { background: #4a6a4e; }
    .stain { height: 28px; border-radius: 8px; margin-top: 6px; font-size: 12px; font-weight: 800; line-height: 28px; }
    .stain.yes { background: #1c2f7a; color: #fff; }
    .stain.no { background: #e8c95a; color: #2b2208; }
    .stain.wait { background: var(--sky); color: var(--teal); }
    .choices { display: grid; gap: 8px; }
    .choices button { text-align: left; background: #fff; color: var(--dark); border: 2px solid var(--line); }
    .choices button.right { background: #e7f6ea; border-color: var(--green); }
    .choices button.wrong { background: #fdecea; border-color: var(--rose); }
    .formula { font-weight: 800; text-align: center; background: #fff; border-radius: 12px; padding: 10px; margin: 10px 0; color: var(--navy); }
    .stars { font-size: 22px; letter-spacing: 2px; }
    input[type=text] {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
      font-size: 16px; font-family: inherit; margin: 8px 0 14px;
    }
    .foot { margin-top: 14px; color: #9bb0b5; font-size: 12px; text-align: center; }
    .tiny { font-size: 13px; color: #4d6469; }
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .compare div { background: #fff; border-radius: 12px; padding: 10px; border: 2px solid var(--line); font-size: 14px; }
    .compare .c { border-color: var(--green); }
    .compare .n { border-color: var(--rose); }
  </style>
</head>
<body>
  <div id="app">
    <div class="top">
      <div class="badge">7 класс · биология</div>
      <div class="badge">баллы: <b id="score">0</b></div>
    </div>
    <div id="screens"></div>
    <p class="foot">Лист-детектив · Балгабекова А. М. · цель 7.1.2.2</p>
  </div>
  <div class="confetti" id="confetti"></div>
<script>
const $ = (sel, root=document) => root.querySelector(sel);
const state = { score: 0, name: "", round: 0, tested: {}, quiz: 0, lastIod: "" };

const ROUNDS = [
  { title: "Элодея на окне", light: true, co2: true, ask: "Будут ли пузырьки кислорода?", right: true,
    hint: "Свет есть, CO₂ есть — растение должно работать." },
  { title: "Ту же банку закрыли шкафом", light: false, co2: true, ask: "Пузырьки пойдут?", right: false,
    hint: "Без света фотосинтез почти останавливается." },
  { title: "Свет есть, воздух без CO₂", light: true, co2: false, ask: "Пузырьки пойдут?", right: false,
    hint: "Углекислый газ — сырьё. Без него сахар не собрать." }
];

const LEAVES = [
  { id: "sun", name: "Зелёный лист со света", cls: "", starch: true, why: "Были свет, CO₂ и хлорофилл." },
  { id: "dark", name: "Лист из темноты", cls: "dark", starch: false, why: "Света не было — крахмал не накопился." },
  { id: "co2", name: "Лист из банки без CO₂", cls: "foil", starch: false, why: "Не было углекислого газа." },
  { id: "white", name: "Белая часть пёстрого листа", cls: "white", starch: false, why: "Нет хлорофилла — зелёного пигмента." }
];

const QUIZ = [
  { q: "Фотосинтез — это…", a: ["как зелёный лист на свету делает сахар из CO₂ и воды и выделяет кислород", "как растение дышит только ночью", "как йод красит бумагу"], i: 0 },
  { q: "Зачем в опыте йод?", a: ["показывает крахмал: сине-чёрный цвет = лист работал", "убивает микробов на парте", "даёт растению свет"], i: 0 },
  { q: "Если закрыть лист фольгой, крахмала нет, потому что…", a: ["не было света", "закончилась вода в кастрюле", "йод испортился"], i: 0 },
  { q: "Белая часть пёстрого листа не синеет, потому что…", a: ["в ней нет хлорофилла", "она слишком молодая", "в ней слишком много света"], i: 0 },
  { q: "Что обязательно нужно для фотосинтеза?", a: ["свет, углекислый газ и хлорофилл (ещё вода)", "только вода и темнота", "только йод и фольга"], i: 0 }
];

function addScore(n){ state.score += n; $("#score").textContent = state.score; }
function beep(ok=true){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "sine"; o.frequency.value = ok ? 660 : 180; g.gain.value = .05;
    o.connect(g); g.connect(ctx.destination); o.start();
    setTimeout(() => { o.stop(); ctx.close(); }, 140);
  } catch(_){}
}
function burst(){
  const box = $("#confetti"); box.innerHTML = "";
  for (let i=0;i<24;i++){
    const d = document.createElement("div");
    d.style.cssText = `position:absolute;left:${Math.random()*100}%;top:-10px;width:8px;height:12px;background:${["#C4A035","#1A6B7A","#E8B923","#fff"][i%4]};border-radius:2px;animation:fall ${1+Math.random()}s linear forwards`;
    box.appendChild(d);
  }
  if (!$("#fallstyle")) {
    const s = document.createElement("style");
    s.id = "fallstyle";
    s.textContent = "@keyframes fall{to{transform:translateY(110vh) rotate(240deg);opacity:0}}";
    document.head.appendChild(s);
  }
  setTimeout(() => box.innerHTML = "", 1400);
}

function go(name){
  const map = { home, how, svetlo, after1, iod, quiz, diploma };
  $("#screens").innerHTML = `<section class="screen on card">${map[name]()}</section>`;
  bind(name);
  history.replaceState(null, "", location.pathname + location.search + "#" + name);
}

function home(){
  return `
    <div class="kicker">игра к статье</div>
    <h1>Лист-детектив</h1>
    <p class="lead">Почему мышь в банке с мятой выжила на солнце, а в шкафу — нет? Сначала пузырьки кислорода. Потом — йод и крахмал.</p>
    <label class="tiny">Как тебя зовут?</label>
    <input id="nm" type="text" maxlength="24" placeholder="имя" value="${state.name}" />
    <div class="grid2">
      <button class="lab-card" data-go="how"><small>полный путь</small><b>Две лаборатории</b><p class="tiny">пузырьки → йод</p></button>
      <button class="lab-card" data-go="svetlo"><small>QR 1</small><b>Лаборатория «Пузырьки»</b></button>
      <button class="lab-card" data-go="iod"><small>QR 2</small><b>Лаборатория «Йод»</b></button>
      <button class="lab-card" data-go="quiz"><small>финал</small><b>Вопросы и диплом</b></button>
    </div>`;
}
function how(){
  return `
    <div class="kicker">как играть</div>
    <h2>Правила</h2>
    <p>1. Смотри условия. Если есть <b>свет</b> и <b>CO₂</b>, элодея пускает пузырьки кислорода.</p>
    <p>2. Потом капни йод на четыре листа. Сине-чёрный — крахмал есть, лист работал.</p>
    <p>3. Ищи, чего не хватило: света, газа или хлорофилла.</p>
    <div class="hint">Цель 7.1.2.2: исследовать условия фотосинтеза, а не зубрить длинную формулу.</div>
    <button class="gold" data-go="svetlo">Начать с пузырьков</button>
    <button class="ghost" data-go="home">Назад</button>`;
}
function svetlo(){
  const r = ROUNDS[state.round] || ROUNDS[0];
  const bubbles = r.light && r.co2;
  return `
    <div class="kicker">лаборатория 1 · опыт ${state.round+1}/3</div>
    <h2>${r.title}</h2>
    <p>${r.ask}</p>
    <div class="lamp ${r.light ? "on" : ""}">${r.light ? "☀️ свет" : "🌑 темно"}</div>
    <div class="arena">
      <div class="tube ${r.light ? "" : "dark"}" id="tube">
        <div class="leafs">${r.co2 ? "🌿 элодея · в воде есть CO₂" : "🌿 элодея · CO₂ убрали"}</div>
        ${bubbles ? `<div class="bubble" style="left:40%"></div><div class="bubble" style="left:58%;animation-delay:.4s"></div><div class="bubble" style="left:48%;animation-delay:.8s"></div>` : ""}
      </div>
      <div class="tiny" style="text-align:center;margin-top:8px">${r.co2 ? "в банке обычный воздух" : "натронная известь забрала CO₂"}</div>
    </div>
    <div class="grid2">
      <button class="green" data-ans="yes">Пузырьки будут</button>
      <button class="rose" data-ans="no">Пузырьков не будет</button>
    </div>
    <div id="msg" class="hint">${r.hint}</div>`;
}
function after1(){
  return `
    <div class="kicker">мост</div>
    <h2>Кислород — след работы</h2>
    <p class="formula">свет + CO₂ + вода + зелёный лист → сахар + кислород</p>
    <p>Пузырьки видны сразу. В школе чаще ищут <b>крахмал</b>: его показывает йод.</p>
    <div class="ok">Без света или без углекислого газа пузырьков нет — фотосинтез не идёт.</div>
    <button class="gold" data-go="iod">Лаборатория «Йод»</button>
    <button class="ghost" data-go="home">В меню</button>`;
}
function iod(){
  const done = Object.keys(state.tested).length;
  return `
    <div class="kicker">лаборатория 2 · йодная проба · ${done}/4</div>
    <h2>На какой лист капнуть йод?</h2>
    <p>Сине-чёрный = крахмал есть. Жёлтый = лист не работал.</p>
    <div class="leaves">
      ${LEAVES.map(L => {
        const t = state.tested[L.id];
        const stain = t === true ? `<div class="stain yes">сине-чёрный</div>` : t === false ? `<div class="stain no">жёлтый</div>` : `<div class="stain wait">капни йод</div>`;
        return `<button class="leafbox" data-leaf="${L.id}"><b>${L.name}</b><div class="blob ${L.cls}"></div>${stain}</button>`;
      }).join("")}
    </div>
    <div id="msg" class="${state.lastIod ? (state.lastIod.ok ? "ok" : "bad") : "hint"}">${state.lastIod ? state.lastIod.t : "Нажми лист — это капля йода. Проверь все четыре."}</div>
    <button class="gold" id="nexts" ${done >= 4 ? "" : "disabled"}>Я увидел(а) разницу</button>`;
}
function quiz(){
  const i = state.quiz;
  if (i >= QUIZ.length) {
    return `
      <div class="kicker">сравнение</div>
      <h2>Когда лист работает</h2>
      <div class="compare">
        <div class="c"><b>Крахмал есть</b><br/>свет<br/>есть CO₂<br/>зелёная часть</div>
        <div class="n"><b>Крахмала нет</b><br/>темно / фольга<br/>нет CO₂<br/>белая часть листа</div>
      </div>
      <button class="gold" data-go="diploma">Диплом</button>`;
  }
  const item = QUIZ[i];
  return `
    <div class="kicker">вопрос ${i+1}/${QUIZ.length}</div>
    <h2>${item.q}</h2>
    <div class="choices" id="qz">${item.a.map((t,idx)=>`<button data-i="${idx}">${t}</button>`).join("")}</div>
    <div id="msg"></div>`;
}
function diploma(){
  const s = state.score;
  const stars = s >= 70 ? "★★★★★" : s >= 40 ? "★★★★☆" : "★★★☆☆";
  const who = state.name || "исследователь";
  return `
    <div class="kicker">готово</div>
    <h1>Диплом</h1>
    <p class="stars">${stars}</p>
    <p><b>${who}</b> умеет проверить, какие условия нужны для фотосинтеза.</p>
    <p class="formula">${s} баллов</p>
    <div class="ok">Цепочка: Пристли (мышь и мята) → свет Ингенхауза → йод показывает крахмал.</div>
    <button class="gold" data-go="home">Ещё раз</button>`;
}

function bind(name){
  $("#screens").querySelectorAll("[data-go]").forEach(b => {
    b.onclick = () => {
      if (name==="home") state.name = ($("#nm") && $("#nm").value.trim()) || state.name;
      go(b.dataset.go);
    };
  });
  if (name==="svetlo"){
    document.querySelectorAll("[data-ans]").forEach(b => b.onclick = () => {
      const r = ROUNDS[state.round];
      const yes = b.dataset.ans === "yes";
      const ok = yes === r.right;
      const msg = $("#msg");
      if (ok) {
        beep(true); addScore(12); burst();
        msg.className = "ok";
        msg.textContent = r.right
          ? "Верно. Свет и CO₂ на месте — пузырьки кислорода."
          : "Верно. Условия неполные — фотосинтез не идёт, пузырьков нет.";
        setTimeout(() => {
          state.round += 1;
          if (state.round >= ROUNDS.length) go("after1");
          else go("svetlo");
        }, 1000);
      } else {
        beep(false);
        msg.className = "bad";
        msg.textContent = r.right
          ? "Посмотри: лампа горит и CO₂ не убрали."
          : "Чего-то не хватает. Без света или без CO₂ пузырьков не будет.";
      }
    });
  }
  if (name==="iod"){
    document.querySelectorAll("[data-leaf]").forEach(b => b.onclick = () => {
      const L = LEAVES.find(x => x.id === b.dataset.leaf);
      if (!L) return;
      const first = state.tested[L.id] === undefined;
      state.tested[L.id] = L.starch;
      if (first) addScore(L.starch ? 10 : 8);
      beep(true);
      if (L.starch) burst();
      state.lastIod = { ok: L.starch, t: (L.starch ? "Крахмал есть. " : "Крахмала нет. ") + L.why };
      go("iod");
    });
    $("#nexts").onclick = () => { addScore(10); burst(); go("quiz"); };
  }
  if (name==="quiz" && state.quiz < QUIZ.length){
    const item = QUIZ[state.quiz];
    $("#qz").onclick = (e) => {
      const btn = e.target.closest("button");
      if (!btn || btn.disabled) return;
      const ok = Number(btn.dataset.i) === item.i;
      [...$("#qz").children].forEach((b, idx) => {
        b.disabled = true;
        if (idx === item.i) b.classList.add("right");
      });
      if (ok) { btn.classList.add("right"); addScore(8); beep(true); burst(); }
      else { btn.classList.add("wrong"); beep(false); }
      $("#msg").className = ok ? "ok" : "bad";
      $("#msg").textContent = ok ? "Так." : "Сверься с комиксом: свет, CO₂, хлорофилл, йод.";
      setTimeout(() => { state.quiz += 1; go("quiz"); }, 900);
    };
  }
}

function boot(){
  const h = (location.hash || "").replace("#", "");
  const alias = { svetlo: "svetlo", iod: "iod", lab1: "svetlo", lab2: "iod" };
  const start = alias[h] || (h && {home,how,svetlo,after1,iod,quiz,diploma}[h] ? h : "home");
  go(start);
}
boot();
</script>
</body>
</html>
